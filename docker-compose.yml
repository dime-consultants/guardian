services:
  kn-finance-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
        - NEXT_PUBLIC_ALLOWED_HOSTS=${NEXT_PUBLIC_ALLOWED_HOSTS}
        - NEXT_PUBLIC_USE_LOCALSTORAGE_TOKENS=${NEXT_PUBLIC_USE_LOCALSTORAGE_TOKENS:-false}
        - NEXT_PUBLIC_DEFAULT_DEMO_MODE=${NEXT_PUBLIC_DEFAULT_DEMO_MODE:-false}
    container_name: kn-finance-app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
      - NEXT_PUBLIC_ALLOWED_HOSTS=${NEXT_PUBLIC_ALLOWED_HOSTS}
      - NEXT_PUBLIC_USE_LOCALSTORAGE_TOKENS=${NEXT_PUBLIC_USE_LOCALSTORAGE_TOKENS:-false}
      - NEXT_PUBLIC_DEFAULT_DEMO_MODE=${NEXT_PUBLIC_DEFAULT_DEMO_MODE:-false}
      - XAI_API_KEY=${XAI_API_KEY}
    restart: unless-stopped
    networks:
      - kn-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:alpine
    container_name: kn-nginx
    ports:
      - "6080:80"
      - "6443:443"
    volumes:
      - ./nginx/kuehne.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - kn-finance-app
    restart: unless-stopped
    networks:
      - kn-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  kn-network:
    driver: bridge