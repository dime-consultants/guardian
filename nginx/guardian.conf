# Nginx configuration for kuehne.dimeconsultants.africa
# SSL is terminated by host Nginx - this container handles HTTP only

upstream guardian_app {
    server guardian-ui:3000;
}

# HTTP Server Block (SSL terminated upstream by host Nginx)
server {
    listen 80;
    listen [::]:80;
    server_name guardian.dimeconsultants.africa stage-guardian.dimeconsultants.africa;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Main Application Proxy
    location / {
        proxy_pass http://guardian_app;
        proxy_http_version 1.1;

        # WebSocket Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Static Assets - Aggressive Caching
    location /_next/static/ {
        proxy_pass http://guardian_app;
        proxy_cache_valid 30d;
        proxy_cache_bypass $http_pragma $http_authorization;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # Health Check Endpoint
    location /health {
        access_log off;
        proxy_pass http://guardian_app;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
