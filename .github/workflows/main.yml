name: Build Image & Trigger K3s Deployment

on:
  push:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-trigger:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Prepare Deployment Metadata
        id: prepare
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "master" ]]; then
            ENV_NAME="prod"
            NODE_ENV="production"
            NEXT_PUBLIC_BACKEND_URL="https://invoicing.dimeconsultants.africa"
            NEXT_PUBLIC_ALLOWED_HOSTS="guardian.dimeconsultants.africa"

          elif [[ "${{ github.ref_name }}" == "develop" ]]; then
            ENV_NAME="stage"
            NODE_ENV="production"
            NEXT_PUBLIC_BACKEND_URL="https://stage-invoicing.dimeconsultants.africa"
            NEXT_PUBLIC_ALLOWED_HOSTS="stage-guardian.dimeconsultants.africa"

          else
            echo "Unsupported branch: ${{ github.ref_name }}"
            exit 1
          fi

          IMAGE_NAME="guardian"
          SHORT_SHA="${GITHUB_SHA::7}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE_TAG="ghcr.io/${OWNER}/${IMAGE_NAME}:${ENV_NAME}-${SHORT_SHA}"

          echo "env=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "node_env=$NODE_ENV" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "next_public_backend_url=$NEXT_PUBLIC_BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "next_public_allowed_hosts=$NEXT_PUBLIC_ALLOWED_HOSTS" >> "$GITHUB_OUTPUT"

          echo "Environment: $ENV_NAME"
          echo "NODE_ENV: $NODE_ENV"
          echo "Image tag: $IMAGE_TAG"
          echo "Backend URL: $NEXT_PUBLIC_BACKEND_URL"
          echo "Allowed hosts: $NEXT_PUBLIC_ALLOWED_HOSTS"

      - name: 3. Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 5. Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true

          tags: |
            ${{ steps.prepare.outputs.image_tag }}

          build-args: |
            NODE_ENV=${{ steps.prepare.outputs.node_env }}
            NEXT_PUBLIC_BACKEND_URL=${{ steps.prepare.outputs.next_public_backend_url }}
            NEXT_PUBLIC_ALLOWED_HOSTS=${{ steps.prepare.outputs.next_public_allowed_hosts }}
            NEXT_PUBLIC_USE_LOCALSTORAGE_TOKENS=false
            NEXT_PUBLIC_DEFAULT_DEMO_MODE=false

          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 6. Trigger Infrastructure Deployment
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.INFRA_PAT }}
          repository: dime-consultants/infrastructure
          event-type: deploy-app
          client-payload: |
            {
              "app_repo": "${{ github.repository }}",
              "env": "${{ steps.prepare.outputs.env }}",
              "image_tag": "${{ steps.prepare.outputs.image_tag }}",
              "target_server": "dime"
            }
