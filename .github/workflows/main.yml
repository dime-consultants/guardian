name: Build Image & Trigger Deployment

on:
  push:
    branches: ["develop", "main", "master"]

jobs:
  build-and-trigger:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      # 2. Prepare environment, image tag, compose file, and secrets payload
      - name: 2. Prepare Deployment Metadata
        id: prepare
        shell: bash
        run: |
          # Determine environment
          if [[ "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "master" ]]; then
            ENV_NAME="prod"
            COMPOSE_FILE="docker-compose.yml"
          else
            ENV_NAME="stage"
            COMPOSE_FILE="docker-compose.stage.yml"
          fi

          # Generate image tag
          IMAGE_NAME="qb-ui"
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:${ENV_NAME}-${TIMESTAMP}"

          # Validate compose file
          if [ ! -f "$COMPOSE_FILE" ]; then
            echo "Error: $COMPOSE_FILE not found"
            exit 1
          fi

          # Encode compose file
          COMPOSE_B64=$(base64 -w 0 "$COMPOSE_FILE")

          # Prepare environment secrets
          #
          # Add secrets here when needed, for example:
          #
          # declare -A secrets=(
          #   ["API_KEY"]="${{ secrets.API_KEY }}"
          #   ["DATABASE_URL"]="${{ secrets.DATABASE_URL }}"
          # )
          #
          declare -A secrets=()

          SECRETS_JSON="{}"

          for key in "${!secrets[@]}"; do
            value="${secrets[$key]}"

            if [ -n "$value" ]; then
              SECRETS_JSON=$(echo "$SECRETS_JSON" | \
                jq --arg k "$key" --arg v "$value" '.[$k] = $v')
            fi
          done

          SECRETS_JSON=$(echo "$SECRETS_JSON" | jq -c .)

          # Outputs
          echo "env=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "compose_file=$COMPOSE_FILE" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "compose_b64=$COMPOSE_B64" >> "$GITHUB_OUTPUT"
          echo "secrets_json=$SECRETS_JSON" >> "$GITHUB_OUTPUT"

          echo "Environment: $ENV_NAME"
          echo "Compose file: $COMPOSE_FILE"
          echo "Image tag: $IMAGE_TAG"

      # 3. Login, build, and push Docker image
      - name: 3. Build & Push Docker Image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ steps.prepare.outputs.image_tag }}
        run: |
          echo "$DOCKERHUB_TOKEN" | \
            docker login \
              -u "$DOCKERHUB_USERNAME" \
              --password-stdin

          docker build \
            --platform linux/amd64 \
            -t "$IMAGE_TAG" \
            .

          docker push "$IMAGE_TAG"

      # 4. Trigger infrastructure deployment
      - name: 4. Trigger Infrastructure Deployment
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.INFRA_PAT }}
          repository: stevendegwa/infra
          event-type: deploy-app
          client-payload: |
            {
              "app_repo": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "env": "${{ steps.prepare.outputs.env }}",
              "sha": "${{ github.sha }}",
              "image_tag": "${{ steps.prepare.outputs.image_tag }}",
              "docker_compose_b64": "${{ steps.prepare.outputs.compose_b64 }}",
              "env_secrets": ${{ steps.prepare.outputs.secrets_json }}
            }
